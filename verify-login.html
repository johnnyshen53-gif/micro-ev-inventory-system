<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店長登入驗證</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="page auth-page"><section class="panel auth-panel">
  <p class="eyebrow">安全切換驗證</p><h1>驗證店長帳號</h1>
  <p>此頁只測試新版登入與店長權限，不讀寫庫存。密碼直接送到店家的 Supabase，驗證後立即清空；測試工作階段會登出，不儲存登入憑證。</p>
  <form id="verify-form">
    <div class="field"><label for="verify-username">登入帳號</label><input id="verify-username" value="johnny" autocomplete="username" readonly></div>
    <div class="field"><label for="verify-password">原本的登入密碼</label><input id="verify-password" type="password" autocomplete="current-password" required></div>
    <button id="verify-submit" type="submit">驗證登入與店長權限</button>
  </form>
  <p id="verify-result" role="status" aria-live="polite"></p>
  <p>此頁供店長檢查登入；正式庫存系統已改用帳號登入。請勿在對話中傳送密碼。</p>
  <a href="index.html">回到庫存系統</a>
</section></main><script src="supabase-config.js?v=3"></script><script src="verify-login.js?v=1"></script></body>
</html>
